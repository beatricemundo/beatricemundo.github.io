<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Être et les pronoms sujets — drill sans fin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f2a44; --navy-2:#2b3859; --burgundy:#8b2635; --burgundy-2:#a83244;
  --cream:#faf5ea; --paper:#fffdf7; --ink:#1d2233; --muted:#5f6577; --line:#e3dac6;
  --ok:#2f6b4f; --ok-bg:#e3f1e8; --bad:#8b2635; --bad-bg:#f6e0e3;
  --board:#1f2a44; --board-ink:#faf5ea;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --cream:#141a2c; --paper:#1c243b; --ink:#efe9da; --muted:#a9adbd; --line:#34405f;
    --burgundy:#d0596a; --burgundy-2:#e07484; --ok:#7fcaa0; --ok-bg:#1f3a30;
    --bad:#f0a0ab; --bad-bg:#3e2229; --board:#0f1424; --board-ink:#faf5ea; --navy:#0f1424; --navy-2:#222c48;
  }
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 60px}
header.hero{background:var(--navy);color:#faf5ea;padding:34px 20px 30px;border-bottom:6px solid var(--burgundy)}
header.hero .in{max-width:820px;margin:0 auto}
header.hero h1{font-family:var(--serif);font-weight:800;font-size:2.1rem;line-height:1.15;margin:0 0 6px}
header.hero p{margin:0;color:#d9d3c4;font-size:.98rem}
.tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
.tab,.chip{font:inherit;cursor:pointer;border:2px solid var(--navy-2);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500}
.tab[aria-selected="true"]{background:var(--navy);color:#faf5ea;border-color:var(--navy)}
@media (prefers-color-scheme: dark){.tab[aria-selected="true"]{background:var(--burgundy);border-color:var(--burgundy)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border-width:1.5px;border-color:var(--line);font-size:.86rem;padding:5px 13px}
.chip[aria-pressed="true"]{border-color:var(--burgundy);color:var(--burgundy);font-weight:700}
:focus-visible{outline:3px solid var(--burgundy-2);outline-offset:2px}

details.rappel{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
details.rappel summary{cursor:pointer;padding:12px 16px;font-weight:700}
details.rappel .body{padding:0 16px 16px}
table.conj{width:100%;border-collapse:collapse;font-size:.95rem}
table.conj td,table.conj th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.conj th{font-weight:500;color:var(--muted);font-size:.82rem}
table.conj td.f{font-family:var(--serif);font-weight:800;font-size:1.05rem;color:var(--burgundy)}
.rules{margin:12px 0 0;padding-left:1.1rem;font-size:.92rem}
.rules li{margin:4px 0}

.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:28px 24px 26px;position:relative;overflow:hidden;min-height:150px}
.board::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.07);pointer-events:none}
.board .task{font-size:.84rem;color:#c9c3b3;margin:0 0 10px}
.board .sentence{font-family:var(--serif);font-weight:600;font-size:1.85rem;line-height:1.3;margin:0}
.board .sentence.small{font-size:1.4rem}
.board .sub{margin:12px 0 0;font-size:.95rem;color:#d9d3c4}
.blank{display:inline-block;min-width:3.4ch;border-bottom:3px solid var(--burgundy-2);color:transparent;user-select:none;margin:0 2px}
.blank.filled{color:#f2c9cf;border-bottom-color:transparent}
.flip{animation:flip .38s ease-out}
@keyframes flip{from{transform:perspective(600px) rotateX(-70deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.flip{animation:none}}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
@media (max-width:520px){.opts{grid-template-columns:1fr}.board .sentence{font-size:1.5rem}}
.opt{font:inherit;font-size:1.05rem;text-align:left;cursor:pointer;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:baseline}
.opt kbd{font-family:var(--sans);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt:hover:not(:disabled){border-color:var(--navy-2)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.typebox{display:flex;gap:10px;margin-top:16px}
.typebox input{flex:1;font:inherit;font-size:1.1rem;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.btn{font:inherit;font-weight:700;cursor:pointer;background:var(--burgundy);color:#fff;border:0;border-radius:10px;padding:11px 20px}
@media (prefers-color-scheme: dark){.btn{color:#1a1020}}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:hover{filter:brightness(1.08)}

.feedback{margin-top:16px;border-radius:10px;padding:14px 16px;background:var(--paper);border:1px solid var(--line)}
.feedback.ok{border-left:6px solid var(--ok)}
.feedback.no{border-left:6px solid var(--bad)}
.feedback .verdict{font-family:var(--serif);font-size:1.15rem}
.feedback.ok .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.feedback p{margin:6px 0}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;margin-top:10px;font-size:.88rem;color:var(--muted)}
@media (max-width:520px){.recap{grid-template-columns:repeat(2,1fr)}}
.recap span.hl{color:var(--burgundy);font-weight:700}
.recap b{font-family:var(--serif)}
.next{margin-top:12px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.4rem}
.stat span{font-size:.75rem;color:var(--muted)}
.gloss{color:var(--muted);font-size:.9rem}

.duo-who{font-family:var(--serif);font-size:1.1rem;margin:0 0 12px;color:var(--burgundy)}
.reveal{margin-top:16px}
.answer{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:10px;padding:14px 16px;margin-top:14px}
.answer .big{font-family:var(--serif);font-size:1.4rem;margin:0}
.hidden{display:none}
.nav{display:flex;gap:10px;margin-top:14px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.timer{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.timer .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--navy-2);border-radius:99px}
.timer .fill.low{background:var(--burgundy)}
.timer span{font-family:var(--serif);font-weight:800;min-width:2.4ch;text-align:right;font-size:1.05rem}
@media (prefers-color-scheme: dark){.timer .fill{background:var(--ok)}.timer .fill.low{background:var(--burgundy)}}
footer{margin-top:28px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<header class="hero">
  <div class="in">
    <h1>Les pronoms sujets et le verbe être</h1>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" id="tab-quiz" aria-selected="true" aria-controls="panel-quiz">Quiz sans fin</button>
    <button class="tab" role="tab" id="tab-duo" aria-selected="false" aria-controls="panel-duo">À l’oral en duo</button>
  </div>


  <!-- QUIZ -->
  <section id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz">
    <div class="chips" role="group" aria-label="Niveau">
      <button class="chip" data-mode="pron" aria-pressed="true">1. Pronoms</button>
      <button class="chip" data-mode="verb" aria-pressed="false">2. Conjugaison</button>
      <button class="chip" data-mode="mix" aria-pressed="false">3. Mélange (chronométré)</button>
      <button class="chip" data-mode="write" aria-pressed="false">4. Écrire (type it)</button>
    </div>
    <div class="timer hidden" id="timer" aria-hidden="true"><div class="track"><div class="fill" id="timerFill"></div></div><span id="timerLbl"></span></div>

    <div class="board flip" id="board"></div>
    <div id="answerArea"></div>
    <div class="nav"><button class="btn ghost" id="prevBtn">Précédent</button><button class="btn" id="nextBtn">Suivant</button></div>
    <div id="feedback" role="status" aria-live="polite"></div>

    <div class="stats" aria-label="Score">
      <div class="stat"><b id="sStreak">0</b><span>série (streak)</span></div>
      <div class="stat"><b id="sBest">0</b><span>record</span></div>
      <div class="stat"><b id="sN">0</b><span>réponses</span></div>
      <div class="stat"><b id="sPct">–</b><span>réussite</span></div>
    </div>
  </section>

  <!-- DUO -->
  <section id="panel-duo" role="tabpanel" aria-labelledby="tab-duo" class="hidden">
    <p class="gloss">Deux étudiants se parlent (speak) à tour de rôle. L’étudiant qui a (has) la carte dit (say) la phrase complète à voix haute; son partenaire écoute (listens), puis clique (click) sur <b>Révéler</b> pour vérifier (to verify).</p>
    <div class="timer" id="duoTimer" aria-hidden="true"><div class="track"><div class="fill" id="duoTimerFill"></div></div><span id="duoTimerLbl"></span></div>
    <div class="board flip" id="duoBoard"></div>
    <div id="duoAnswer"></div>
    <div class="reveal" id="duoBtns"></div>
  </section>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const NB = '\u00A0';
const rand = n => Math.floor(Math.random()*n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const noAcc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ---------- data ---------- */
const FORM = {je:'suis',tu:'es',il:'est',elle:'est',on:'est',nous:'sommes',vous:'êtes',ils:'sont',elles:'sont'};
const WHO = {suis:'je',es:'tu',est:'il / elle / on',sommes:'nous',êtes:'vous',sont:'ils / elles'};
const PGLOSS = {je:'I',tu:'you (informal, one person)',il:'he / it',elle:'she / it',on:'one / we (informal)',nous:'we',vous:'you (formal, or several people)',ils:'they (masculine or mixed)',elles:'they (all feminine)'};

const ADJ = [
 {m:'content',f:'contente',mp:'contents',fp:'contentes',en:'happy',p:1},
 {m:'fatigué',f:'fatiguée',mp:'fatigués',fp:'fatiguées',en:'tired',p:1},
 {m:'grand',f:'grande',mp:'grands',fp:'grandes',en:'tall / big',p:1,th:1},
 {m:'petit',f:'petite',mp:'petits',fp:'petites',en:'small / short',p:1,th:1},
 {m:'intelligent',f:'intelligente',mp:'intelligents',fp:'intelligentes',en:'smart',p:1},
 {m:'occupé',f:'occupée',mp:'occupés',fp:'occupées',en:'busy',p:1},
 {m:'prêt',f:'prête',mp:'prêts',fp:'prêtes',en:'ready',p:1},
 {m:'gentil',f:'gentille',mp:'gentils',fp:'gentilles',en:'kind',p:1},
 {m:'américain',f:'américaine',mp:'américains',fp:'américaines',en:'American',p:1},
 {m:'canadien',f:'canadienne',mp:'canadiens',fp:'canadiennes',en:'Canadian',p:1},
 {m:'italien',f:'italienne',mp:'italiens',fp:'italiennes',en:'Italian',p:1},
 {m:'français',f:'française',mp:'français',fp:'françaises',en:'French',p:1},
 {m:'cher',f:'chère',mp:'chers',fp:'chères',en:'expensive',th:1},
 {m:'intéressant',f:'intéressante',mp:'intéressants',fp:'intéressantes',en:'interesting',p:1,th:1},
 {m:'nouveau',f:'nouvelle',mp:'nouveaux',fp:'nouvelles',en:'new',p:1,th:1},
 {m:'joli',f:'jolie',mp:'jolis',fp:'jolies',en:'pretty',p:1,th:1},
 {m:'malade',f:'malade',mp:'malades',fp:'malades',en:'sick',p:1},
 {m:'sympa',f:'sympa',mp:'sympas',fp:'sympas',en:'nice',p:1},
 {m:'timide',f:'timide',mp:'timides',fp:'timides',en:'shy',p:1}
];
const PROF = [
 {m:'étudiant',f:'étudiante',mp:'étudiants',fp:'étudiantes',en:'student'},
 {m:'professeur',f:'professeure',mp:'professeurs',fp:'professeures',en:'professor'},
 {m:'ingénieur',f:'ingénieure',mp:'ingénieurs',fp:'ingénieures',en:'engineer'},
 {m:'acteur',f:'actrice',mp:'acteurs',fp:'actrices',en:'actor'},
 {m:'musicien',f:'musicienne',mp:'musiciens',fp:'musiciennes',en:'musician'},
 {m:'avocat',f:'avocate',mp:'avocats',fp:'avocates',en:'lawyer'}
];
const PLACES = [
 {t:'à Paris',en:'in Paris'},{t:'à New York',en:'in New York'},{t:'à Montréal',en:'in Montreal'},
 {t:'à la maison',en:'at home'},{t:'en classe',en:'in class'},{t:'au café',en:'at the café'},
 {t:'à la gare',en:'at the station'},{t:'à la bibliothèque',en:'at the library'},
 {t:'à l’université',en:'at the university'},{t:'en retard',en:'late'},{t:'ici',en:'here',th:1}
];
/* noun-phrase subjects: p = pronoun that replaces them */
const NPS = [
 {t:'Paul',p:'il',g:'m',w:'Paul is one man'},
 {t:'Marc',p:'il',g:'m',w:'Marc is one man'},
 {t:'Le professeur',p:'il',g:'m',w:'le professeur is one man (masculine singular)'},
 {t:'Mon frère',p:'il',g:'m',w:'mon frère is one male person'},
 {t:'Monsieur Durand',p:'il',g:'m',w:'Monsieur = one man'},
 {t:'Le train',p:'il',g:'m',th:1,w:'le train is masculine singular, so even a thing becomes il'},
 {t:'La gare',p:'elle',g:'f',th:1,w:'la gare is feminine singular, so even a thing becomes elle'},
 {t:'Marie',p:'elle',g:'f',w:'Marie is one woman'},
 {t:'Julie',p:'elle',g:'f',w:'Julie is one woman'},
 {t:'La professeure',p:'elle',g:'f',w:'la professeure is one woman'},
 {t:'Ma sœur',p:'elle',g:'f',w:'ma sœur is one female person'},
 {t:'Madame Durand',p:'elle',g:'f',w:'Madame = one woman'},
 {t:'Paul et Marc',p:'ils',g:'m',w:'two men make a masculine group'},
 {t:'Les étudiants',p:'ils',g:'m',w:'les étudiants is a masculine (or mixed) plural'},
 {t:'Mes frères',p:'ils',g:'m',w:'mes frères is masculine plural'},
 {t:'Paul et Marie',p:'ils',g:'m',w:'a mixed group (even with one male) always takes ils'},
 {t:'Mes parents',p:'ils',g:'m',w:'mes parents is a mixed group, so ils'},
 {t:'Marie et son frère',p:'ils',g:'m',w:'a mixed group (even with one male) always takes ils'},
 {t:'Marie et Julie',p:'elles',g:'f',w:'two women make an all-feminine group'},
 {t:'Les étudiantes',p:'elles',g:'f',w:'les étudiantes is all feminine'},
 {t:'Mes sœurs',p:'elles',g:'f',w:'mes sœurs is all feminine'},
 {t:'Ma mère et ma sœur',p:'elles',g:'f',w:'two women make an all-feminine group'},
 {t:'Ma sœur et moi',p:'nous',g:'f',w:'the group includes me, so nous'},
 {t:'Paul et moi',p:'nous',g:'m',w:'the group includes me, so nous'},
 {t:'Toi et moi',p:'nous',w:'the group includes me, so nous'},
 {t:'Toi et ton frère',p:'vous',w:'you + another person = several people you are addressing, so vous'},
 {t:'Toi et Marie',p:'vous',w:'you + another person = several people you are addressing, so vous'},
 {t:'Marie et toi',p:'vous',w:'you + another person = several people you are addressing, so vous'}
];
const TV = [
 {c:'You are talking to your best friend.',a:'tu',w:'A close friend gets tu.'},
 {c:'You are talking to your professor.',a:'vous',w:'A professor gets vous (respect, distance).'},
 {c:'You are talking to two classmates.',a:'vous',w:'Two or more people always get vous.'},
 {c:'You are talking to a little child.',a:'tu',w:'Children get tu.'},
 {c:'You are talking to a stranger on the street.',a:'vous',w:'An adult stranger gets vous.'},
 {c:'You are talking to the clerk at the train station.',a:'vous',w:'A stranger in a service situation gets vous.'},
 {c:'You are texting your sister.',a:'tu',w:'Family gets tu.'},
 {c:'You are talking to your cat.',a:'tu',w:'One pet, one friend: tu.'},
 {c:'You are talking to a whole class of students.',a:'vous',w:'A group always gets vous.'},
 {c:'You are talking to your boss.',a:'vous',w:'Bosses get vous, unless they invite you to say tu.'},
 {c:'You are talking to a classmate your age at a party.',a:'tu',w:'Peers your age, in a relaxed setting, get tu.'},
 {c:'You are talking to your friend’s parents.',a:'vous',w:'Parents of a friend get vous.'}
];

/* ---------- subject / complement builders ---------- */
function mkPron(p){
  p = p || pick(['je','tu','il','elle','nous','vous','ils','elles','on']);
  const n = ['je','tu','il','elle','on'].includes(p) ? 's' : 'p';
  const g = p==='il'||p==='ils' ? 'm' : p==='elle'||p==='elles' ? 'f' : p==='on' ? null : pick(['m','f']);
  return {t:cap(p),p,n,g,np:false};
}
function mkNP(filter){
  const x = pick(NPS.filter(filter||(()=>true)));
  const n = ['il','elle'].includes(x.p) ? 's' : 'p';
  return {t:x.t,p:x.p,n,g:x.g||pick(['m','f']),np:true,th:!!x.th,w:x.w};
}
const fm = (c,g,n) => n==='s' ? c[g] : c[g+'p'];
function mkComp(s, needG){
  const th = !!s.th;
  for(let k=0;k<80;k++){
    const kind = s.p==='on' ? 'place' : th ? pick(['adj','adj','place']) : pick(['adj','adj','prof','place']);
    if(needG && kind==='place') continue;
    if(kind==='place'){
      const c = pick(PLACES.filter(x=>th ? x.th : true));
      return {text:c.t,en:c.en,base:c.t,gendered:false,kind};
    }
    const c = pick(kind==='adj' ? ADJ.filter(a=>th ? a.th : a.p) : PROF);
    const g = s.g || 'm';
    const gendered = s.n==='s' ? c.m!==c.f : c.mp!==c.fp;
    if(needG && !gendered) continue;
    return {text:fm(c,g,s.n),en:c.en,base:c.m,gendered,kind};
  }
  return {text:'ici',en:'here',base:'ici',gendered:false,kind:'place'};
}
const sentence = (s,c,blank) => `${s.t} ${blank||FORM[s.p]} ${c.text}.`;

/* ---------- distractors & feedback texts ---------- */
const VTRAP = {suis:['es'],es:['est'],est:['es','êtes'],sommes:['sont'],êtes:['est','es'],sont:['sommes','est']};
function verbOptions(ans){
  const all = ['suis','es','est','sommes','êtes','sont'];
  const set = [ans];
  (VTRAP[ans]||[]).forEach(x=>{ if(!set.includes(x)) set.push(x); });
  const pool = shuffle(all.filter(x=>!set.includes(x)));
  while(set.length<4) set.push(pool.pop());
  return shuffle(set);
}
function pronOptions(ans){
  const partner={il:'elle',elle:'il',ils:'elles',elles:'ils'};
  const num={il:'ils',ils:'il',elle:'elles',elles:'elle'};
  const other={tu:'vous',vous:'tu',je:'nous',nous:'je'};
  const set=[ans];
  [partner[ans],num[ans],other[ans]].forEach(x=>{ if(x&&!set.includes(x)) set.push(x); });
  const pool=shuffle(['je','tu','il','elle','nous','vous','ils','elles'].filter(x=>!set.includes(x)));
  while(set.length<4) set.push(pool.pop());
  return shuffle(set);
}
function verbWhy(picked, ans, subjLabel){
  const map = {
    'es>est':'<b>es</b> belongs only to <b>tu</b>. With il / elle / on (or a name), it is <b>est</b>.',
    'est>es':'<b>est</b> is for il / elle / on. With <b>tu</b>, it is <b>es</b>.',
    'est>êtes':'<b>est</b> is for one third person (il / elle / on). With <b>vous</b>, it is <b>êtes</b>.',
    'êtes>est':'<b>êtes</b> is only for <b>vous</b>. For one third person, use <b>est</b>.',
    'sont>sommes':'<b>sont</b> means “they are”. For “we are”, it is <b>sommes</b>.',
    'sommes>sont':'<b>sommes</b> means “we are”. For “they are”, it is <b>sont</b>.',
    'est>sont':'<b>est</b> is singular. A group takes <b>sont</b>.',
    'sont>est':'<b>sont</b> is plural. One person or “on” takes <b>est</b>.',
    'es>êtes':'<b>es</b> is for one friend (tu). Several people or a formal “you” take <b>êtes</b>.',
    'êtes>es':'<b>êtes</b> is for vous. With <b>tu</b> it is <b>es</b>.'
  };
  return map[picked+'>'+ans] || `<b>${picked}</b> goes with ${WHO[picked]}, not with ${subjLabel}.`;
}
function pronWhy(picked, ans, gloss){
  const map = {
    'ils>elles':'<b>ils</b> is for male or mixed groups. This group is all female, so <b>elles</b>.',
    'elles>ils':'<b>elles</b> is only for all-female groups. Male or mixed groups take <b>ils</b>.',
    'il>elle':'<b>il</b> is masculine. The subject is feminine, so <b>elle</b>.',
    'elle>il':'<b>elle</b> is feminine. The subject is masculine, so <b>il</b>.',
    'il>ils':'<b>il</b> is one person. Here there are several, so <b>ils</b>.',
    'elle>elles':'<b>elle</b> is one person. Here there are several, so <b>elles</b>.',
    'ils>il':'<b>ils</b> is plural. Here it is just one, so <b>il</b>.',
    'elles>elle':'<b>elles</b> is plural. Here it is just one, so <b>elle</b>.',
    'tu>vous':'<b>tu</b> is for one friend. Here the situation calls for <b>vous</b>.',
    'vous>tu':'<b>vous</b> is formal or plural. Here it is one friend, so <b>tu</b>.',
    'je>nous':'<b>je</b> is only me. If others are included, it is <b>nous</b>.',
    'nous>je':'<b>nous</b> includes other people. Just me is <b>je</b>.',
    'elles>nous':'<b>nous</b> includes me. <b>elles</b> is other people, not me.',
    'ils>nous':'<b>nous</b> includes me. <b>ils</b> is other people, not me.',
    'tu>nous':'<b>nous</b> includes me. <b>tu</b> is only you.',
    'vous>nous':'<b>nous</b> includes me. <b>vous</b> is you, not me.'
  };
  return map[picked+'>'+ans] || `<b>${picked}</b> means “${PGLOSS[picked]}”, which doesn’t fit here. The right one is <b>${ans}</b> (${PGLOSS[ans]}).`;
}
function recap(hl){
  const rows=[['je','suis'],['tu','es'],['il / elle / on','est'],['nous','sommes'],['vous','êtes'],['ils / elles','sont']];
  return '<div class="recap">'+rows.map(([p,f])=>`<span class="${f===hl?'hl':''}">${p} <b>${f}</b></span>`).join('')+'</div>';
}
const OK = ['Bravo'+NB+'!','Exactement'+NB+'!','Très bien'+NB+'!','Parfait'+NB+'!','Oui'+NB+'!'];
const NO = ['Pas tout à fait.','Presque.','Regardons ça.','Pas cette fois.'];

/* ---------- question generators ---------- */
const blank = '<span class="blank" id="theBlank">___</span>';

function qVerb(){
  const s = Math.random()<0.6 ? mkPron() : mkNP();
  const c = mkComp(s,false), ans = FORM[s.p];
  return {
    type:'mc', key:'v:'+s.p, ans, options:verbOptions(ans),
    task:'Choisissez (choose) la forme d’être (pick the right form of être) :',
    html:`${s.t} ${blank} ${c.text}.`, sub:`(${c.en})`,
    full:sentence(s,c),
    explain:(pk)=> (s.np?`<p><b>${s.t}</b> is replaced by <b>${s.p}</b> (${PGLOSS[s.p]}), so the form is <b>${ans}</b>.</p>`:`<p><b>${s.p}</b> takes <b>${ans}</b>.</p>`) + (pk&&pk!==ans?`<p>${verbWhy(pk,ans,s.p)}</p>`:''),
    hl:ans
  };
}
function qPron(){
  const p = pick(['je','tu','il','elle','nous','vous','ils','elles']);
  const needG = ['il','elle','ils','elles'].includes(p);
  const s = mkPron(p), c = mkComp(s,needG), ans = p;
  return {
    type:'mc', key:'p:'+p, ans, options:pronOptions(ans),
    task:'Choisissez (choose) le pronom sujet :',
    html:`${blank} ${FORM[p]} ${c.text}.`, sub:`(${c.en})`,
    full:sentence(s,c),
    explain:(pk)=>{
      let base = `<p>The verb <b>${FORM[p]}</b> points to <b>${WHO[FORM[p]]}</b>.`;
      if(needG) base += ` The word <b>${c.text}</b> is ${s.g==='f'?'feminine':'masculine'}${s.n==='p'?' plural':''}, so <b>${p}</b>.`;
      base += '</p>';
      return base + (pk&&pk!==ans?`<p>${pronWhy(pk,ans)}</p>`:'');
    },
    hl:FORM[p]
  };
}
function qNP(){
  const s = mkNP(), c = mkComp(s,false), ans = s.p;
  return {
    type:'mc', key:'n:'+ans, ans, options:pronOptions(ans),
    task:'Remplacez (remplace) le sujet par un pronom (replace the subject with a pronoun) :',
    html:`${blank} ${FORM[s.p]} ${c.text}.`, sub:`Original : ${sentence(s,c)} (${c.en})`,
    full:sentence(s,c),
    explain:(pk)=>`<p>${cap(s.w)} → <b>${ans}</b>.</p>` + (pk&&pk!==ans?`<p>${pronWhy(pk,ans)}</p>`:''),
    hl:FORM[ans]
  };
}
function qTV(){
  const x = pick(TV), pl = pick(PLACES), a = x.a, o = a==='tu'?'vous':'tu';
  const good = `${cap(a)} ${FORM[a]} ${pl.t}.`;
  const opts = [good, `${cap(a)} ${FORM[o]} ${pl.t}.`, `${cap(o)} ${FORM[o]} ${pl.t}.`, `${cap(o)} ${FORM[a]} ${pl.t}.`];
  return {
    type:'mc', key:'tv:'+a, ans:good, options:shuffle(opts),
    task:'Tu ou vous ? Choisissez (choose) la bonne phrase (pick the correct sentence) :',
    html:`« You are ${pl.en}. »`, sub:x.c, small:true,
    full:good,
    explain:(pk)=>`<p>${x.w} So: <b>${good}</b></p>` + (pk&&pk!==good?`<p>Check both parts: the pronoun (tu / vous) and its matching form (es / êtes).</p>`:''),
    hl:FORM[a]
  };
}
function qOn(){
  const s = mkPron('nous'), c = mkComp({p:'on',n:'s',g:null},false), ans='est';
  return {
    type:'mc', key:'on', ans, options:verbOptions(ans),
    task:'Dans la conversation, Remplacez (remplace) nous par on (in everyday speech, swap nous for on) :',
    html:`On ${blank} ${c.text}.`, sub:`Formel : Nous sommes ${c.text}. (${c.en})`,
    full:`On est ${c.text}.`,
    explain:(pk)=>`<p><b>on</b> means “we”, but grammatically it is singular: it always takes the <b>il / elle</b> form, <b>est</b>.</p>` + (pk&&pk!==ans?`<p>${verbWhy(pk,ans,'on')}</p>`:''),
    hl:'est'
  };
}
function qWrite(){
  const s = Math.random()<0.65 ? mkPron() : mkNP(), c = mkComp(s,false), ans = FORM[s.p];
  return {
    type:'write', key:'w:'+s.p, ans,
    task:'Écris (write) la forme d’être :',
    html:`${s.t} ${blank} <span style="font-size:.6em;opacity:.7">(être)</span> ${c.text}.`, sub:`(${c.en})`,
    full:sentence(s,c),
    explain:(pk)=> (s.np?`<p><b>${s.t}</b> = <b>${s.p}</b>, so <b>${ans}</b>.</p>`:`<p><b>${s.p}</b> takes <b>${ans}</b>.</p>`) + (pk&&pk!==ans&&WHO[pk]?`<p>${verbWhy(pk,ans,s.p)}</p>`:''),
    hl:ans
  };
}
const GENS = {
  mix:[qVerb,qVerb,qPron,qPron,qNP,qNP,qTV,qOn,qWrite],
  verb:[qVerb,qVerb,qOn],
  pron:[qPron,qNP,qTV],
  write:[qWrite]
};


/* ---------- timers ---------- */
const timers = {};
function stopTimer(key){ if(timers[key]){ clearInterval(timers[key]); timers[key]=null; } }
function startTimer(key, ids, secs, onExpire){
  stopTimer(key);
  const fill=$(ids[0]), lbl=$(ids[1]); const t0=Date.now();
  fill.classList.remove('low'); fill.style.width='100%'; lbl.textContent=secs;
  timers[key]=setInterval(()=>{
    const left=Math.max(0,secs*1000-(Date.now()-t0));
    fill.style.width=(100*left/(secs*1000))+'%';
    lbl.textContent=Math.ceil(left/1000);
    fill.classList.toggle('low',left<=3000);
    if(left<=0){ stopTimer(key); onExpire(); }
  },100);
}
const SECS = 30;

/* ---------- quiz state & rendering ---------- */
const st = {mode:'pron',h:[],i:-1,n:0,ok:0,streak:0,best:0,miss:{}};
const $ = id => document.getElementById(id);
const cur = () => st.h[st.i];

function newEntry(){
  const gens = GENS[st.mode];
  const lastKey = st.h.length ? st.h[st.h.length-1].q.key : null;
  let best=null, bw=-1;
  for(let k=0;k<6;k++){
    const q = pick(gens)();
    if(q.key===lastKey && k<5) continue;
    const w = (1+2*(st.miss[q.key]||0))*Math.random();
    if(w>bw){bw=w;best=q;}
  }
  return {q:best,done:false,ok:null,picked:null,note:''};
}
function goNext(){
  if(st.i < st.h.length-1){ st.i++; }
  else {
    st.h.push(newEntry());
    if(st.h.length>200){ st.h.shift(); }
    st.i = st.h.length-1;
  }
  renderQuestion();
}
function goPrev(){ if(st.i>0){ st.i--; renderQuestion(); } }
function resetSession(){ st.h=[]; st.i=-1; goNext(); }

function renderQuestion(){
  const e=cur(), q=e.q, b=$('board');
  stopTimer('quiz');
  b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip');
  b.innerHTML = `<p class="task">${q.task}</p><p class="sentence${q.small?' small':''}">${q.html}</p>${q.sub?`<p class="sub">${q.sub}</p>`:''}`;
  $('feedback').innerHTML='';
  const timed = st.mode==='mix';
  $('timer').classList.toggle('hidden',!timed);
  const a = $('answerArea');
  if(q.type==='mc'){
    a.innerHTML = '<div class="opts">'+q.options.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${o}</span></button>`).join('')+'</div>';
    a.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>answerMC(btn.dataset.i)));
  } else {
    a.innerHTML = '<div class="typebox"><input id="typed" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ta réponse"><button class="btn" id="checkBtn">Vérifier</button></div>';
    $('checkBtn').addEventListener('click',answerType);
    $('typed').addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();answerType();} });
  }
  if(e.done){ applyDone(); }
  else {
    if(timed) startTimer('quiz',['timerFill','timerLbl'],SECS,onQuizTimeout);
    if(q.type==='write') $('typed').focus();
  }
  updateNav();
}
function updateNav(){
  const e=cur();
  $('prevBtn').disabled = st.i<=0;
  $('nextBtn').textContent = e.done ? 'Suivant' : 'Passer (skip)';
}
function record(ok){
  st.n++; if(ok){st.ok++;st.streak++;st.best=Math.max(st.best,st.streak);} else st.streak=0;
  const k=cur().q.key; st.miss[k]=ok?Math.max(0,(st.miss[k]||0)-1):(st.miss[k]||0)+1;
  $('sStreak').textContent=st.streak; $('sBest').textContent=st.best; $('sN').textContent=st.n;
  $('sPct').textContent=Math.round(100*st.ok/st.n)+'%';
}
function applyDone(){
  const e=cur(), q=e.q;
  if(q.type==='mc'){
    document.querySelectorAll('#answerArea .opt').forEach(btn=>{
      const o=q.options[btn.dataset.i];
      btn.disabled=true;
      if(o===q.ans) btn.classList.add('right');
      else if(o===e.picked) btn.classList.add('wrong');
    });
  } else {
    const inp=$('typed'); inp.value=e.picked||''; inp.disabled=true; $('checkBtn').disabled=true;
  }
  const bl=$('theBlank');
  if(bl && !q.key.startsWith('tv')){ bl.textContent=q.ans; bl.classList.add('filled'); }
  const wrongPick = !e.ok && e.picked ? e.picked : null;
  $('feedback').innerHTML = `<div class="feedback ${e.ok?'ok':'no'}"><p><span class="verdict">${e.ok?pick(OK):pick(NO)}</span></p>${q.explain(wrongPick)}${e.note?`<p>${e.note}</p>`:''}<p class="gloss">${q.full}</p>${recap(q.hl)}</div>`;
}
function finish(ok){ record(ok); applyDone(); updateNav(); $('nextBtn').focus(); }
function onQuizTimeout(){
  const e=cur(); if(e.done) return;
  e.done=true; e.ok=false; e.note='<b>Temps écoulé</b> (time’s up).';
  const inp=$('typed'); if(inp && inp.value.trim()) e.picked=inp.value.trim().toLowerCase();
  finish(false);
}
function answerMC(i){
  const e=cur(); if(e.done) return;
  stopTimer('quiz');
  e.done=true; e.picked=e.q.options[i]; e.ok=e.picked===e.q.ans;
  finish(e.ok);
}
function answerType(){
  const e=cur(); if(e.done) return;
  const inp=$('typed'); const raw=inp.value.trim().toLowerCase();
  if(!raw){inp.focus();return;}
  stopTimer('quiz');
  const exact = raw===e.q.ans, noAccent = !exact && noAcc(raw)===noAcc(e.q.ans);
  e.done=true; e.picked=raw; e.ok=exact||noAccent;
  e.note = noAccent ? `Watch the accent: <b>${e.q.ans}</b>.` : '';
  finish(e.ok);
}

/* nav + mode chips + tabs */
$('prevBtn').addEventListener('click',goPrev);
$('nextBtn').addEventListener('click',goNext);
document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===ch));
  st.mode=ch.dataset.mode; resetSession();
}));
function showTab(which){
  const quiz = which==='quiz';
  $('tab-quiz').setAttribute('aria-selected',quiz); $('tab-duo').setAttribute('aria-selected',!quiz);
  $('panel-quiz').classList.toggle('hidden',!quiz); $('panel-duo').classList.toggle('hidden',quiz);
  if(quiz){ stopTimer('duo'); renderQuestion(); }
  else { stopTimer('quiz'); if(!duo.h.length) duoNext(); else duoRender(); }
}
$('tab-quiz').addEventListener('click',()=>showTab('quiz'));
$('tab-duo').addEventListener('click',()=>showTab('duo'));

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const quizOn = !$('panel-quiz').classList.contains('hidden');
  if(quizOn){
    const en=cur();
    if(!en.done && en.q.type==='mc' && /^[1-4]$/.test(e.key)) answerMC(parseInt(e.key,10)-1);
    else if(e.key==='ArrowRight' || (en.done && e.key==='Enter' && document.activeElement!==$('nextBtn'))){ e.preventDefault(); goNext(); }
    else if(e.key==='ArrowLeft'){ goPrev(); }
  } else {
    if(e.key==='ArrowRight'){ duoNext(); } else if(e.key==='ArrowLeft'){ duoPrev(); }
  }
});

/* ---------- duo mode ---------- */
const duo = {h:[],i:-1};
const dcur = () => duo.h[duo.i];
function duoNew(){
  const s = Math.random()<0.6 ? mkPron() : mkNP();
  const c = mkComp(s,false);
  const who = duo.h.length && duo.h[duo.h.length-1].who==='A' ? 'B' : 'A';
  return {s,c,who,revealed:false,timeout:false};
}
function duoNext(){
  if(duo.i < duo.h.length-1) duo.i++;
  else { duo.h.push(duoNew()); if(duo.h.length>200){duo.h.shift();} duo.i=duo.h.length-1; }
  duoRender();
}
function duoPrev(){ if(duo.i>0){ duo.i--; duoRender(); } }
function duoReveal(timeout){
  const e=dcur(); if(e.revealed) return;
  e.revealed=true; e.timeout=!!timeout; duoRender();
}
function duoRender(){
  const e=dcur(), {s,c}=e;
  stopTimer('duo');
  const b=$('duoBoard'); b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip');
  const hint = c.kind==='place' ? c.text : c.base;
  b.innerHTML = `<p class="task">Étudiant ${e.who} : dis (say) la phrase complète (say the full sentence)</p><p class="sentence">${s.t} + être + ${hint}</p><p class="sub">${c.kind==='place'?c.en:`(${c.en}; adjust the ending if needed)`}</p>`;
  $('duoTimer').classList.toggle('hidden',e.revealed);
  if(e.revealed){
    let html = `<div class="answer"><p class="big">${sentence(s,c)}</p>`;
    if(s.np){ const ps=Object.assign({},s,{t:cap(s.p)}); html += `<p class="gloss">Avec un pronom : <b>${sentence(ps,c)}</b></p>`; }
    html += '</div>';
    if(e.timeout) html = '<p class="gloss"><b>Temps écoulé</b> (time’s up)</p>'+html;
    $('duoAnswer').innerHTML = html;
  } else {
    $('duoAnswer').innerHTML = '';
    startTimer('duo',['duoTimerFill','duoTimerLbl'],SECS,()=>duoReveal(true));
  }
  $('duoBtns').innerHTML = `<div class="nav"><button class="btn ghost" id="duoPrev" ${duo.i<=0?'disabled':''}>Précédent</button>${e.revealed?'':'<button class="btn" id="duoReveal">Révéler (reveal)</button>'}<button class="btn ${e.revealed?'':'ghost'}" id="duoNext">${e.revealed?'Suivant':'Passer (skip)'}</button></div>`;
  $('duoPrev').addEventListener('click',duoPrev);
  $('duoNext').addEventListener('click',duoNext);
  if(!e.revealed) $('duoReveal').addEventListener('click',()=>duoReveal(false));
  else $('duoNext').focus();
}

/* ---------- go ---------- */
goNext();
</script>
</body>
</html>
